name: One-time nuntago branch consolidation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-consolidation.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuntago-branch-consolidation-20261027
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'Ergorum/nuntago' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify inventory, archive divergent tips, and delete safely
        run: python3 scripts/consolidate_branches.py --apply
